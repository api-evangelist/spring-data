  - Rate Limiting
description: Spring Data is a self-hosted set of data-access libraries (JPA, MongoDB, Redis, REST, etc.) — there is no vendor-hosted API and therefore no vendor-imposed throughput limits. Throttling for Spring Data REST endpoints is the responsibility of the operator's surrounding gateway or Spring Security filter chain. Numeric limits are entirely operator-determined.
sources:
  - https://spring.io/projects/spring-data
  - https://docs.spring.io/spring-data/rest/reference/
notes: No vendor-imposed rate limits. Effective limits depend on whatever gateway or filter the operator places in front of Spring Data REST.
responseCodes:
  throttled: 429
limits:
  - name: Operator-Defined
    scope: deployment
    metric: varies
    limit: see operator deployment configuration
    notes: Spring Data ships no built-in throttling. Limits are imposed by the surrounding stack (API gateway, Spring Cloud Gateway, Resilience4j, or backend database connection pool).
policies:
  - name: Self-Hosted Throttling
    description: Spring Data does not emit Retry-After or X-RateLimit-* headers. Operators bolt on rate-limiting via filter chains or external gateways and define the response contract themselves.
  - name: Backpressure From the Database
    description: In practice the effective ceiling for Spring Data REST is the underlying datasource connection pool (HikariCP defaults) and the database server's own concurrency limits, not an HTTP-tier rate limiter.
maintainers:
  - name: VMware Tanzu / Broadcom
    url: https://tanzu.vmware.com/spring-runtime
