naftiko: 1.0.0-alpha2
info:
  label: Spring Data REST API — Discovery
  description: 'Spring Data REST API — Discovery. 1 operations. Lead operation: List All Exported Repositories. Self-contained
    Naftiko capability covering one Spring Data business surface.'
  tags:
  - Spring Data
  - Discovery
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_DATA_API_KEY: SPRING_DATA_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-discovery
    baseUri: http://localhost:8080
    description: Spring Data REST API — Discovery business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: listrepositories
        method: GET
        description: List All Exported Repositories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: rest-discovery-rest
    port: 8080
    description: REST adapter for Spring Data REST API — Discovery. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: listrepositories
        description: List All Exported Repositories
        call: rest-discovery.listrepositories
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-discovery-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Data REST API — Discovery. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-all-exported-repositories
      description: List All Exported Repositories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-discovery.listrepositories
      outputParameters:
      - type: object
        mapping: $.
