aid: spring-data
name: Spring Data
description: >-
  Spring Data's mission is to provide a familiar and consistent, Spring-based programming model for data access while
  still retaining the special traits of the underlying data store. It makes it easy to use data access technologies,
  relational and non-relational databases, map-reduce frameworks, and cloud-based data services. This is an umbrella
  project which contains many subprojects that are specific to a given database.
