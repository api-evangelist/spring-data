principles:
  - name: Visibility
    description: Spring Data exposes Micrometer metrics for repository-level query timing and HikariCP pool saturation; operators ship these to their observability stack to attribute database cost back to specific repositories and endpoints.
  - name: Allocation
    description: Allocate the underlying database spend (RDS, MongoDB Atlas, Redis Cloud) to the team that owns each Spring Data repository. Tag the database resources with team and product in the cloud provider's tagging.
  - name: Optimization
    description: Cost levers live in the data layer - tune query plans surfaced via JPA/SQL logging, cap PageSize defaults on Spring Data REST collection resources, and use projections to shrink payload size and downstream egress.
  - name: Accountability
    description: Application teams own the cost of the queries their Spring Data repositories generate; platform/SRE owns the shared datastore footprint and any Tanzu Spring support contract.
